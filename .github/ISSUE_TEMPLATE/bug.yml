name: Bug report
description: Something in a Nifty extension doesn't work as it should.
labels: [bug]
body:
  - type: dropdown
    id: extension
    attributes:
      label: Extension
      options:
        - ".NET Explorer"
        - "AI Review"
        - "Archive Browser"
        - "Auto Hide"
        - "Beautify"
        - "Branches"
        - "Buttons"
        - "C# Scratchpad"
        - "C# Templates"
        - "Changelists"
        - "Code Metrics"
        - "Code Runner"
        - "Containers"
        - "CSS Classes"
        - "CSS Variables"
        - "Data Viewer"
        - "Dependency Guard"
        - "Docs"
        - "Docstrings"
        - "Env"
        - "Explorer+"
        - "Extension Audit"
        - "Folder Compare"
        - "Format on Save"
        - "Generated"
        - "Git Graph"
        - "Git Links"
        - "Go Tools"
        - "gRPC"
        - "HCL Tools"
        - "Helm & Kustomize"
        - "Hex Editor"
        - "i18n"
        - "Import Cost"
        - "JSON"
        - "Launch"
        - "Licenses"
        - "Log Viewer"
        - "Macros"
        - "Mermaid"
        - "Monitor"
        - "Nginx"
        - "Node Search"
        - "Notebook Servers"
        - "NuGet"
        - "OpenAPI"
        - "Paired Notebooks"
        - "Paste JSON as Code"
        - "PHP Quality"
        - "PHP Server"
        - "Pre-commit"
        - "Pretty Errors"
        - "Print"
        - "Problems"
        - "pytest"
        - "Python Envs"
        - "Python Profiler"
        - "Python REPL"
        - "Replace"
        - "REST Client"
        - "Run"
        - "SCSS IntelliSense"
        - "Search Scopes"
        - "Settings Sync"
        - "SFTP"
        - "Shell Format"
        - "Shortcut Trainer"
        - "Slurm"
        - "Snippets"
        - "Spreadsheet Viewer"
        - "SQL"
        - "SQLite"
        - "Struct Layout"
        - "SVN"
        - "Tags"
        - "Team Settings"
        - "Templates"
        - "Todo"
        - "Tools for Arduino"
        - "Tools for Godot"
        - "Tools for Unity"
        - "Undo Tree"
        - "Vertical Tabs"
        - "Workspace Keybindings"
        - "XAML"
        - "XML"
        - "YAML"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file like …
        2. Run …
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The extension version, your editor and its version, and your operating system.
      placeholder: 0.1.0, VS Code 1.105, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: If there's an error, paste it here. Most Nifty extensions write to their own channel in the Output panel.
      render: text
